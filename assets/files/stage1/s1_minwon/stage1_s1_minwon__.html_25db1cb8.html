<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>링크 바로가기</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f7;
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 24px;
            color: #1d1d1f;
            margin-bottom: 20px;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background-color: #0071e3;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #0077ed;
        }
        .url-text {
            margin-top: 15px;
            font-size: 14px;
            color: #86868b;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>요청하신 페이지로 이동</h1>
        <p>아래 버튼을 누르면 해당 링크로 연결됩니다.</p>
        <a href="http://129.225.152.209/?asof=2026-10-12&start=2026-10-12&end=2026-10-18" class="btn" target="_blank">페이지 열기</a>
        <div class="url-text">http://129.225.152.209/?asof=2026-10-12&amp;start=2026-10-12&amp;end=2026-10-18</div>
    </div>
</body>
</html>
